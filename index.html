<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Type Checker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#7c6cf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Type Checker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1c1c1e; --muted:#6b6b72; --line:#e3e3e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111114; --card:#1c1c20; --text:#f2f2f5; --muted:#9a9aa3; --line:#2c2c32; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:16px 14px 40px; }
  h1 { font-size:22px; margin:6px 0 12px; }
  .search { position:relative; }
  input { width:100%; font-size:17px; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); outline:none; }
  input:focus { border-color:#7c6cf0; }
  .sugg { position:absolute; left:0; right:0; top:100%; margin-top:4px; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; z-index:5; box-shadow:0 8px 24px rgba(0,0,0,.12); }
  .sugg button { display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; padding:11px 14px; border:0; border-bottom:1px solid var(--line); background:none; color:var(--text); font-size:16px; cursor:pointer; gap:8px; }
  .sugg button:last-child { border-bottom:0; }
  .sugg button:hover, .sugg button.active { background:rgba(124,108,240,.12); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; }
  .name { font-size:24px; font-weight:700; margin:0 0 8px; }
  .badge { display:inline-block; padding:4px 10px; border-radius:999px; color:#fff; font-size:13px; font-weight:600; margin:2px 4px 2px 0; text-shadow:0 1px 1px rgba(0,0,0,.25); }
  .row { margin-top:14px; }
  .row h3 { font-size:14px; margin:0 0 6px; display:flex; gap:8px; align-items:center; }
  .mult { font-weight:800; min-width:34px; padding:2px 6px; border-radius:6px; text-align:center; font-size:13px; }
  .m4 { background:#d93a3a; color:#fff; } .m2 { background:#f08a3c; color:#fff; }
  .m1 { background:var(--line); color:var(--text); } .mh { background:#4f9a5a; color:#fff; }
  .mq { background:#2f7a4a; color:#fff; } .m0 { background:#555; color:#fff; }
  .none { color:var(--muted); font-size:14px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; cursor:pointer; }
  .tabs button.on { background:#7c6cf0; color:#fff; border-color:#7c6cf0; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .grid button { padding:9px 4px; border-radius:10px; border:2px solid transparent; color:#fff; font-weight:600; font-size:14px; cursor:pointer; opacity:.55; }
  .grid button.on { opacity:1; border-color:var(--text); }
  .hint { color:var(--muted); font-size:13px; margin-top:10px; line-height:1.4; }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Pokémon Type Checker</h1>
  <div class="tabs">
    <button id="tabName" class="on">By Pokémon</button>
    <button id="tabType">By type</button>
  </div>
  <div id="nameMode">
    <div class="search">
      <input id="q" placeholder="Type a Pokémon… e.g. Gengar" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div id="sugg" class="sugg" hidden></div>
    </div>
  </div>
  <div id="typeMode" hidden>
    <div class="grid" id="grid"></div>
    <div class="hint">Pick one or two types.</div>
  </div>
  <div id="out"></div>
  <div class="hint">Covers Gen 1–9 (incl. DLC) plus regional and Rotom forms, using current-gen typings. Abilities aren't counted — e.g. Levitate makes Ground moves do nothing, and Flash Fire / Water Absorb etc. add immunities.</div>
</main>

const DEX = RAW.split(",").map(s=>s.trim()).filter(Boolean).map(s=>{ const [n,t]=s.split("|"); return {n, t:[...t].map(c=>T[c])}; });
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9♀♂]/g,"");

function badge(t){ return `<span class="badge" style="background:${COL[t]}">${t}</span>`; }
function render(title, types){
  const groups = {4:[],2:[],1:[],0.5:[],0.25:[],0:[]};
  TYPES.forEach(a=>{ const m = types.reduce((x,d)=>x*eff(a,d),1); groups[m].push(a); });
  const rows = [[4,"m4","4×","Very weak to"],[2,"m2","2×","Weak to"],[0.5,"mh","½×","Resists"],[0.25,"mq","¼×","Strongly resists"],[0,"m0","0×","Immune to"]];
  let h = `<div class="card">${title?`<div class="name">${title}</div>`:""}<div>${types.map(badge).join("")}</div>`;
  rows.forEach(([k,c,l,lab])=>{ if(!groups[k].length && (k===4||k===0.25)) return;
    h += `<div class="row"><h3><span class="mult ${c}">${l}</span>${lab}</h3>${groups[k].length?groups[k].map(badge).join(""):'<span class="none">None</span>'}</div>`; });
  h += `<details><summary>Neutral (1×) — ${groups[1].length} types</summary><div style="margin-top:6px">${groups[1].map(badge).join("")}</div></details></div>`;
  document.getElementById("out").innerHTML = h;
}

const q = document.getElementById("q"), sugg = document.getElementById("sugg");
let matches = [], active = 0;
function showSugg(){
  const v = norm(q.value); if(!v){ sugg.hidden = true; return; }
  const starts = DEX.filter(p=>norm(p.n).startsWith(v)), has = DEX.filter(p=>!norm(p.n).startsWith(v) && norm(p.n).includes(v));
  matches = starts.concat(has).slice(0,8); active = 0;
  if(!matches.length){ sugg.innerHTML = `<button disabled>No match</button>`; sugg.hidden = false; return; }
  sugg.innerHTML = matches.map((p,i)=>`<button data-i="${i}" class="${i===0?'active':''}"><span>${p.n}</span><span>${p.t.map(badge).join("")}</span></button>`).join("");
  sugg.hidden = false;
}
function pick(p){ q.value = p.n; sugg.hidden = true; q.blur(); render(p.n, p.t); }
q.addEventListener("input", showSugg);
q.addEventListener("keydown", e=>{
  if(sugg.hidden || !matches.length) return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); active=(active+(e.key==="ArrowDown"?1:matches.length-1))%matches.length;
    [...sugg.children].forEach((b,i)=>b.classList.toggle("active",i===active)); }
  if(e.key==="Enter"){ e.preventDefault(); pick(matches[active]); }
});
sugg.addEventListener("pointerdown", e=>{ const b = e.target.closest("button[data-i]"); if(b){ e.preventDefault(); pick(matches[+b.dataset.i]); } });
document.addEventListener("click", e=>{ if(!e.target.closest(".search")) sugg.hidden = true; });

// type picker
const grid = document.getElementById("grid"); let sel = [];
grid.innerHTML = TYPES.map(t=>`<button data-t="${t}" style="background:${COL[t]}">${t}</button>`).join("");
grid.addEventListener("click", e=>{ const b = e.target.closest("button"); if(!b) return; const t = b.dataset.t;
  if(sel.includes(t)) sel = sel.filter(x=>x!==t); else { sel.push(t); if(sel.length>2) sel.shift(); }
  [...grid.children].forEach(x=>x.classList.toggle("on", sel.includes(x.dataset.t)));
  if(sel.length) render("", sel); else document.getElementById("out").innerHTML = ""; });

const tn = document.getElementById("tabName"), tt = document.getElementById("tabType");
tn.onclick = ()=>{ tn.classList.add("on"); tt.classList.remove("on"); nameMode.hidden=false; typeMode.hidden=true; document.getElementById("out").innerHTML=""; };
tt.onclick = ()=>{ tt.classList.add("on"); tn.classList.remove("on"); nameMode.hidden=true; typeMode.hidden=false; document.getElementById("out").innerHTML=""; if(sel.length) render("", sel); };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
