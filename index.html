<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Type Checker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#7c6cf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Type Checker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1c1c1e; --muted:#6b6b72; --line:#e3e3e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111114; --card:#1c1c20; --text:#f2f2f5; --muted:#9a9aa3; --line:#2c2c32; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:16px 14px 40px; }
  h1 { font-size:22px; margin:6px 0 12px; }
  .search { position:relative; }
  input { width:100%; font-size:17px; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); outline:none; }
  input:focus { border-color:#7c6cf0; }
  .sugg { position:absolute; left:0; right:0; top:100%; margin-top:4px; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; z-index:5; box-shadow:0 8px 24px rgba(0,0,0,.12); }
  .sugg button { display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; padding:11px 14px; border:0; border-bottom:1px solid var(--line); background:none; color:var(--text); font-size:16px; cursor:pointer; gap:8px; }
  .sugg button:last-child { border-bottom:0; }
  .sugg button:hover, .sugg button.active { background:rgba(124,108,240,.12); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; }
  .name { font-size:24px; font-weight:700; margin:0 0 8px; }
  .badge { display:inline-block; padding:4px 10px; border-radius:999px; color:#fff; font-size:13px; font-weight:600; margin:2px 4px 2px 0; text-shadow:0 1px 1px rgba(0,0,0,.25); }
  .row { margin-top:14px; }
  .row h3 { font-size:14px; margin:0 0 6px; display:flex; gap:8px; align-items:center; }
  .mult { font-weight:800; min-width:34px; padding:2px 6px; border-radius:6px; text-align:center; font-size:13px; }
  .m4 { background:#d93a3a; color:#fff; } .m2 { background:#f08a3c; color:#fff; }
  .m1 { background:var(--line); color:var(--text); } .mh { background:#4f9a5a; color:#fff; }
  .mq { background:#2f7a4a; color:#fff; } .m0 { background:#555; color:#fff; }
  .none { color:var(--muted); font-size:14px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; cursor:pointer; }
  .tabs button.on { background:#7c6cf0; color:#fff; border-color:#7c6cf0; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .grid button { padding:9px 4px; border-radius:10px; border:2px solid transparent; color:#fff; font-weight:600; font-size:14px; cursor:pointer; opacity:.55; }
  .grid button.on { opacity:1; border-color:var(--text); }
  .hint { color:var(--muted); font-size:13px; margin-top:10px; line-height:1.4; }
  .mini { width:40px; height:40px; image-rendering:pixelated; flex:none; }
  .pn { display:flex; align-items:center; gap:6px; }
  .sugg button { padding-top:4px; padding-bottom:4px; }
  .hero { display:block; width:192px; height:192px; margin:-36px auto -28px; image-rendering:pixelated; }
  .card .name { text-align:center; }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--muted); font-size:14px; }
  /* team builder */
  .btn { padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; cursor:pointer; font-family:inherit; }
  .btn.primary { background:#7c6cf0; border-color:#7c6cf0; color:#fff; } .btn.danger { color:#d93a3a; border-color:#d93a3a55; }
  .btn.small { padding:6px 10px; font-size:14px; } .btn.block { display:block; width:100%; margin-top:8px; } .btn.left { text-align:left; }
  .btn small { opacity:.8; }
  .tb-row { display:flex; gap:8px; margin:8px 0; } .tb-row .btn { flex:1; }
  .tb-head { display:flex; align-items:center; gap:8px; margin:4px 0 8px; } .tb-head h2 { font-size:18px; margin:0; }
  .tb-name { flex:1; font-size:17px; font-weight:700; padding:8px 10px; }
  .tb-teamcard { display:block; width:100%; text-align:left; color:var(--text); font:inherit; cursor:pointer; }
  .tb-tc-top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .fmt { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--line); } .fmt.champ { background:#7c6cf0; color:#fff; }
  .tb-minis { display:flex; gap:2px; margin-top:6px; flex-wrap:wrap; } .tb-minis img { width:44px; height:44px; image-rendering:pixelated; }
  .tb-empty-mini { width:44px; height:44px; border-radius:50%; border:2px dashed var(--line); box-sizing:border-box; transform:scale(.6); }
  .tb-slots { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tb-slot { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 4px 8px; color:var(--text); font:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; min-height:150px; }
  .tb-slot img { width:72px; height:72px; image-rendering:pixelated; margin:-6px 0 -4px; } .tb-slot b { font-size:13px; text-align:center; line-height:1.2; }
  .tb-slot .badge { font-size:10px; padding:2px 6px; margin:1px; } .tb-slot small { color:var(--muted); font-size:11px; text-align:center; }
  .tb-slot.empty { justify-content:center; border-style:dashed; color:var(--muted); } .tb-slot.empty span { font-size:30px; }
  .tb-tabs { display:flex; gap:4px; margin:14px 0 8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:3px; }
  .tb-tabs button { flex:1; border:0; background:none; color:var(--text); padding:8px; border-radius:9px; font-size:14px; font-family:inherit; cursor:pointer; }
  .tb-tabs button.on { background:#7c6cf0; color:#fff; }
  .tb-sugg { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px 10px 6px 4px; margin-top:6px; }
  .tb-sugg > img { width:56px; height:56px; image-rendering:pixelated; flex:none; } .tb-sugg-body { flex:1; min-width:0; } .tb-sugg-body .badge { font-size:11px; padding:2px 7px; }
  .tb-sugg .tb-minis { flex:1; margin:0; } .tb-sugg .tb-minis img { width:40px; height:40px; }
  .tb-checks .ck { padding:8px 10px; border-radius:10px; margin-top:6px; font-size:14px; background:var(--card); border:1px solid var(--line); }
  .ck.ok { border-color:#4f9a5a88; } .ck.warn { border-color:#f08a3c; } .ck.bad { border-color:#d93a3a; background:#d93a3a18; } .ck.info { border-color:#6890f0; }
  .tb-def { display:grid; grid-template-columns:1fr 1fr; gap:4px; } .tb-def-cell { display:flex; align-items:center; gap:6px; font-size:13px; padding:3px 6px; border-radius:8px; }
  .tb-def-cell .badge { min-width:70px; text-align:center; font-size:11px; } .tb-def-cell.hot { background:#d93a3a2a; } .tb-def-cell.warm { background:#f08a3c22; } .tb-def-cell.cool { background:#4f9a5a22; }
  h4 { margin:16px 0 6px; font-size:15px; }
  #tbSheet { position:fixed; inset:0; z-index:50; } #tbSheet[hidden] { display:none; }
  .tb-backdrop { position:absolute; inset:0; background:rgba(0,0,0,.45); }
  .tb-panel { position:absolute; left:0; right:0; bottom:0; max-height:88vh; overflow:auto; background:var(--bg); border-radius:18px 18px 0 0; padding:16px 14px 28px; max-width:560px; margin:0 auto; }
  .tb-panel h3 { margin:0 0 8px; padding-right:36px; } .tb-x { position:absolute; right:12px; top:12px; border:0; background:var(--line); color:var(--text); width:32px; height:32px; border-radius:50%; font-size:15px; cursor:pointer; }
  .tb-panel label { display:block; font-weight:700; font-size:14px; margin:14px 0 4px; }
  .tb-ed-top { display:flex; gap:10px; align-items:center; } .tb-ed-top img { width:96px; height:96px; image-rendering:pixelated; margin:-10px -6px; }
  .tb-chips { display:flex; flex-wrap:wrap; gap:6px; } .chip { padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:14px; font-family:inherit; cursor:pointer; } .chip.on { background:#7c6cf0; color:#fff; border-color:#7c6cf0; }
  .pct { font-size:12px; font-weight:700; color:#7c6cf0; } .chip.on .pct { color:#fff; }
  .tag { font-size:11px; padding:1px 6px; border-radius:6px; background:var(--line); }
  .tb-move .badge, .tb-li .badge { font-size:11px; padding:2px 7px; min-width:58px; text-align:center; }
  .tb-search { margin-bottom:6px; } .tb-list { margin:0 -4px; }
  .tb-group { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:12px 4px 4px; }
  .tb-li { display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); color:var(--text); padding:8px 4px; font:inherit; font-size:15px; cursor:pointer; }
  .tb-li img { width:40px; height:40px; image-rendering:pixelated; flex:none; } .tb-li .li-main { flex:1; min-width:0; } .tb-li small { color:var(--muted); font-size:12px; }

  .btn.opt.on, .chip.opt.on { background:#7c6cf0; border-color:#7c6cf0; color:#fff; }
  .btn.opt.on small, .chip.opt.on small { opacity:.9; }
  #ntDex.dim { opacity:.4; }
  .nt-foot { position:sticky; bottom:-28px; background:var(--bg); padding:10px 0 18px; margin-top:14px; border-top:1px solid var(--line); }
  .nt-foot .hint { margin:0; text-align:center; }
  body.noscroll { overflow:hidden; }
  #tbToast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:#1c1c1e; color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; opacity:0; transition:.2s; z-index:60; pointer-events:none; max-width:90vw; }
  #tbToast.show { opacity:1; transform:translateX(-50%); }
</style>

const DEX = RAW.split(",").map(s=>s.trim()).filter(Boolean).map(s=>{ const [n,id,t]=s.split("|"); return {n, id, t:[...t].map(c=>T[c])}; });
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9♀♂]/g,"");

function badge(t){ return `<span class="badge" style="background:${COL[t]}">${t}</span>`; }
function render(title, types, id){
  const groups = {4:[],2:[],1:[],0.5:[],0.25:[],0:[]};
  TYPES.forEach(a=>{ const m = types.reduce((x,d)=>x*eff(a,d),1); groups[m].push(a); });
  const rows = [[4,"m4","4×","Very weak to"],[2,"m2","2×","Weak to"],[0.5,"mh","½×","Resists"],[0.25,"mq","¼×","Strongly resists"],[0,"m0","0×","Immune to"]];
  let h = `<div class="card">${id?`<img class="hero" src="sprites/${id}.png" alt="">`:""}${title?`<div class="name">${title}</div>`:""}<div>${types.map(badge).join("")}</div>`;
  rows.forEach(([k,c,l,lab])=>{ if(!groups[k].length && (k===4||k===0.25)) return;
    h += `<div class="row"><h3><span class="mult ${c}">${l}</span>${lab}</h3>${groups[k].length?groups[k].map(badge).join(""):'<span class="none">None</span>'}</div>`; });
  h += `<details><summary>Neutral (1×) — ${groups[1].length} types</summary><div style="margin-top:6px">${groups[1].map(badge).join("")}</div></details></div>`;
  document.getElementById("out").innerHTML = h;
}

const q = document.getElementById("q"), sugg = document.getElementById("sugg");
let matches = [], active = 0;
function showSugg(){
  const v = norm(q.value); if(!v){ sugg.hidden = true; return; }
  const starts = DEX.filter(p=>norm(p.n).startsWith(v)), has = DEX.filter(p=>!norm(p.n).startsWith(v) && norm(p.n).includes(v));
  matches = starts.concat(has).slice(0,8); active = 0;
  if(!matches.length){ sugg.innerHTML = `<button disabled>No match</button>`; sugg.hidden = false; return; }
  sugg.innerHTML = matches.map((p,i)=>`<button data-i="${i}" class="${i===0?'active':''}"><span class="pn"><img class="mini" src="sprites/${p.id}.png" alt="" loading="lazy">${p.n}</span><span>${p.t.map(badge).join("")}</span></button>`).join("");
  sugg.hidden = false;
}
function pick(p){ q.value = p.n; sugg.hidden = true; q.blur(); render(p.n, p.t, p.id); }
q.addEventListener("input", showSugg);
q.addEventListener("keydown", e=>{
  if(sugg.hidden || !matches.length) return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); active=(active+(e.key==="ArrowDown"?1:matches.length-1))%matches.length;
    [...sugg.children].forEach((b,i)=>b.classList.toggle("active",i===active)); }
  if(e.key==="Enter"){ e.preventDefault(); pick(matches[active]); }
});
sugg.addEventListener("pointerdown", e=>{ const b = e.target.closest("button[data-i]"); if(b){ e.preventDefault(); pick(matches[+b.dataset.i]); } });
document.addEventListener("click", e=>{ if(!e.target.closest(".search")) sugg.hidden = true; });

// type picker
const grid = document.getElementById("grid"); let sel = [];
grid.innerHTML = TYPES.map(t=>`<button data-t="${t}" style="background:${COL[t]}">${t}</button>`).join("");
grid.addEventListener("click", e=>{ const b = e.target.closest("button"); if(!b) return; const t = b.dataset.t;
  if(sel.includes(t)) sel = sel.filter(x=>x!==t); else { sel.push(t); if(sel.length>2) sel.shift(); }
  [...grid.children].forEach(x=>x.classList.toggle("on", sel.includes(x.dataset.t)));
  if(sel.length) render("", sel); else document.getElementById("out").innerHTML = ""; });

const tn = document.getElementById("tabName"), tt = document.getElementById("tabType"), tm = document.getElementById("tabTeam");
function showTab(which){
  [[tn,"name"],[tt,"type"],[tm,"team"]].forEach(([b,k])=>b.classList.toggle("on", k===which));
  nameMode.hidden = which!=="name"; typeMode.hidden = which!=="type"; teamMode.hidden = which!=="team";
  document.getElementById("out").innerHTML=""; document.getElementById("out").hidden = which==="team"; footHint.hidden = which==="team";
  if (which==="type" && sel.length) render("", sel);
  if (which==="team") window.openTeams && window.openTeams();
  try{ localStorage.setItem("lastTab", which); }catch(e){}
}
tn.onclick = ()=>showTab("name"); tt.onclick = ()=>showTab("type"); tm.onclick = ()=>showTab("team");
try{ const lt = localStorage.getItem("lastTab"); if (lt==="team") setTimeout(()=>showTab("team"),0); }catch(e){}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).catch(()=>{});
</script>
